# Local development broker. Add auth + TLS (see docs/gateway.md) before any real deployment.
listener 1883
listener 9001
protocol websockets
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
# The backend keeps a persistent session, so readings the gateway replays while the backend
# reconnects are queued for it. Allow a long outage's worth (25 nodes x 6 h at 1/min = 9,000;
# accelerated simulation needs more), and keep sessions for a week.
max_queued_messages 200000
persistent_client_expiration 7d
