name: CI
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e "libs/achal-common[dev]" fastapi "uvicorn[standard]" httpx scikit-learn numpy
      - run: ruff check libs services
      - run: pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/dashboard}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: services/dashboard/package-lock.json}
      - run: npm ci
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
