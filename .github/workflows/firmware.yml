# SPDX-License-Identifier: MIT
name: Firmware
on:
  push:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]

jobs:
  platformio:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: firmware}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio==6.1.16
      - run: pio test -e native
      - run: pio run -e node -e siren -e gateway
