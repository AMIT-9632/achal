; SPDX-License-Identifier: MIT
; ACHAL reference firmware. One project, four environments:
;   pio run -e node          surface sensor node (set NODE_ID per board, see README)
;   pio run -e siren         siren controller on the same mesh
;   pio run -e gateway       LoRa radio for the Raspberry Pi gateway (USB serial)
;   pio run -e wokwi         node for the Wokwi simulator (see wokwi/README.md)
;   pio test -e native       frame codec, mesh routing and achal_dsp tests on the host

[platformio]
default_envs = node, siren, gateway

[esp32]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = jgromes/RadioLib@7.1.2
build_flags = -Wall -DSITE_ID=\"jharia-demo\" -DN_NODES=25

[env:node]
extends = esp32
build_src_filter = +<node-esp32/>
lib_deps =
    ${esp32.lib_deps}
    pololu/VL53L0X@1.3.1
build_flags = ${esp32.build_flags} -DNODE_ID=1

[env:siren]
extends = esp32
build_src_filter = +<node-esp32/> -<node-esp32/sensors.cpp>
build_flags = ${esp32.build_flags} -DROLE_SIREN -DNODE_ID=91 -DSIREN_INDEX=1

[env:gateway]
extends = esp32
build_src_filter = +<gateway-lora/>

[env:wokwi]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
build_src_filter = +<wokwi-node/>
lib_ignore = achal_radio
build_flags = -Wall

[env:native]
platform = native
build_src_filter = -<*>
lib_ignore = achal_radio
test_build_src = no
build_flags = -std=c++17 -Wall
